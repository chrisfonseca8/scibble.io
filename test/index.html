<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skribbl Clone</title>

    <!-- p5.js -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.1/lib/p5.min.js"></script>

    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

    <!-- ============== HOME SCREEN ============== -->
    <div id="home-screen" class="screen">
        <div class="container">

            <h1 class="title">skribbl.io</h1>

            <div class="menu">

                <div class="top">
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your name">

                    <select id="language">
                        <option>English</option>
                        <option>French</option>
                        <option>German</option>
                        <option>Spanish</option>
                    </select>
                </div>

                <div class="characterBox">

                    <button id="left" class="arrow">&#10094;</button>

                    <div class="character">
                        <img id="avatar"
                            src="https://api.dicebear.com/8.x/bottts/svg?seed=1">
                    </div>

                    <button id="right" class="arrow">&#10095;</button>

                    <button id="randomBtn">🎲</button>

                </div>

                <button id="createRoom">
                    Create Private Room
                </button>

            </div>
        </div>
    </div>

    <!-- ============== WAITING SCREEN ============== -->
    <div id="waiting-screen" class="screen" style="display:none;">
        <div class="waiting-box">

            <h2>Room Code: <span id="room-code">-----</span></h2>

            <ul id="player-list"></ul>

            <button id="startGameBtn">Start Game</button>

        </div>
    </div>

    <!-- ============== GAME SCREEN ============== -->
    <div id="game-screen" class="screen" style="display:none;">

        <!-- p5 canvas gets attached here -->
        <div id="canvas-container"></div>

        <div id="chat-container">

            <div id="chat-header">Room Chat</div>

            <div id="chat-box"></div>

            <div id="chat-input-container">
                <input
                    id="message-input"
                    type="text"
                    placeholder="Type a message...">

                <button id="send-btn">Send</button>
            </div>

        </div>

    </div>

    <script type="module" src="./scripts/main.js"></script>

</body>
</html>
